services:
  - type: web
    name: dalbit-saju
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CAFE24_LLM_API_KEY
        sync: false
      - key: CAFE24_LLM_MODEL
        value: cafe24/auto
