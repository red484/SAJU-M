name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 54.116.137.102
  DEPLOY_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/saju
  SITE_URL: https://saju.ashwoodfriends.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          python3 - <<'PYKEY'
          import os
          from pathlib import Path

          key = os.environ.get("SSH_KEY", "").replace("\\r\\n", "\n").replace("\\n", "\n")
          key = key.replace("\r", "").strip()
          if not key:
              raise SystemExit("DEPLOY_SSH_KEY is missing")
          Path.home().joinpath(".ssh", "deploy_key").write_text(key + "\n")
          PYKEY
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY must contain an unencrypted SSH private key"
            exit 1
          fi
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA13JEzgqagxDaiAvIhqVtkAv+v3sx7SpU//KnqIFbkd" > ~/.ssh/known_hosts

      - name: Upload source
        run: |
          git archive --format=tar.gz -o release.tar.gz HEAD
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/saju-release.tar.gz"

      # Server-only files (.env.production, .env.db, docker-compose.db.yml, secrets/) are kept.
      - name: Build and restart containers
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_DIR="$DEPLOY_DIR" 'bash -s' <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          find . -mindepth 1 -maxdepth 1 \
            ! -name .env.production ! -name .env.db ! -name docker-compose.db.yml ! -name secrets \
            -exec rm -rf {} +
          tar xzf /tmp/saju-release.tar.gz
          rm -f /tmp/saju-release.tar.gz
          sudo bash deploy/logging/install.sh
          sudo bash deploy/logging/apply-database-logs.sh
          sudo bash deploy/logging/apply-host-proxy-logs.sh
          sudo docker compose --env-file .env.production -f docker-compose.prd.yml up -d --build --wait
          sudo docker image prune -f
          EOF

      - name: Check health
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent "$SITE_URL/api/ready" &&
               SMOKE_BASE_URL="$SITE_URL" npm run smoke; then exit 0; fi
            sleep 5
          done
          exit 1
