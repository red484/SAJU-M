<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">SAJU-M PostgreSQL ERD</title>
  <desc id="desc">app_users, anonymous_sessions, saju_journals, usage_sessions, llm_requests, audit_logs and schema_migrations relationships</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10251f" flood-opacity=".10"/></filter>
    <style>
      .bg{fill:#fbfbfa}.card{fill:#fff;stroke-width:1.5;filter:url(#shadow)}.head{stroke-width:1.5}.title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#173b32}.col{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24332f}.type{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#53635e}.key{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.note{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#53635e}.rel{fill:none;stroke:#344a43;stroke-width:2}.optional{stroke-dasharray:8 7}.dot{fill:#fff;stroke:#344a43;stroke-width:2}.many{fill:none;stroke:#344a43;stroke-width:2;stroke-linecap:round}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <text x="54" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#173b32">SAJU-M PostgreSQL</text>
  <text x="54" y="91" class="note">운영 핵심 테이블 · 2026-09-16 · 로그인 확장 상세는 database.md 참고</text>

