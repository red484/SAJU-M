  <path class="rel" d="M560 400 V495 H895 V550"/><circle class="dot" cx="560" cy="410" r="6"/><path class="many" d="M895 541 l-9 -13 M895 541 l9 -13"/>
  <path class="rel" d="M1090 735 H1150"/><circle class="dot" cx="1099" cy="735" r="6"/><path class="many" d="M1141 735 l-13 -9 M1141 735 l-13 9"/>
  <path class="rel" d="M560 400 V520 H1320 V445"/><circle class="dot" cx="560" cy="410" r="6"/><path class="many" d="M1320 454 l-9 13 M1320 454 l9 13"/>

