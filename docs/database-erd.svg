  <g transform="translate(390 135)"><rect class="card" width="340" height="265" rx="12" stroke="#4d8db7"/><path class="head" d="M12 0h316a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0" fill="#e4f0f7" stroke="#4d8db7"/><text class="title" x="170" y="31" text-anchor="middle">anonymous_sessions</text>
