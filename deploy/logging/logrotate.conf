# Current day plus 29 daily archives: a 30-day operational window.
/var/log/saju/containers.log {
    daily
    rotate 29
    maxage 29
    missingok
    ifempty
    dateext
    compress
    delaycompress
    create 0640 syslog adm
    sharedscripts
    postrotate
        /bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1
    endscript
}
