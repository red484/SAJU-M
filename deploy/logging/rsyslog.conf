# Dedicated socket: these messages never enter the host's shared journal/syslog rules.
ruleset(name="sajuLogs") {
    action(type="omfile" file="/var/log/saju/containers.log"
           fileOwner="syslog" fileGroup="adm" fileCreateMode="0640"
           dirCreateMode="0750" template="RSYSLOG_FileFormat")
    stop
}
input(type="imuxsock" Socket="/var/spool/rsyslog/saju.sock" CreatePath="on" ruleset="sajuLogs")
