# Shared Lightsail nginx must be attached to levelup-net.
# Containers: saju-web:80, saju-backend:9090
server {
    listen 80;
    server_name saju.ashwoodfriends.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name saju.ashwoodfriends.com;

    ssl_certificate /etc/letsencrypt/live/saju.ashwoodfriends.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saju.ashwoodfriends.com/privkey.pem;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;

    location = /health {
        set $saju_backend saju-backend:9090;
        proxy_pass http://$saju_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    location ^~ /api/ {
        set $saju_backend saju-backend:9090;
        proxy_pass http://$saju_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        set $saju_web saju-web:80;
        proxy_pass http://$saju_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
